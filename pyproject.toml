[project]
name = "polish-legal-mcp"
version = "0.2.0"
description = "Remote MCP server for official Polish legislation (ELI) and case law (SAOS)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28,<0.29",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "beautifulsoup4>=4.13",
    "lxml>=6.0",
    "pypdf>=6.21.2,<7",
]

[project.scripts]
polish-legal-mcp = "polish_legal_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "respx>=0.23",
    "ruff>=0.17",
    "pyright>=1.1.410",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polish_legal_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real upstream APIs (opt-in: -m live)"]
addopts = "-m 'not live'"
